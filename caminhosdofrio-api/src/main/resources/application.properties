#porta padrão
server.port=8080

# Conexão com MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/caminhosdofrio?useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=SENHA
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

